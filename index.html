<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the number</title>
    <link rel="stylesheet" href="guess.css">
</head>
<body>
    <div class="game-card">
  <h1>Guess the Number</h1>
  <p class="instruction">Enter a number between 1 and 50</p>
  
  <input type="number" id="userGuess" placeholder="e.g. 25">
  <button id="submitBtn">Guess</button>
  
  <p id="feedback"></p>
  <p id="attemptsText">Attempts left: <span id="attemptsLeft">7</span></p>
</div>

<!-- Link your JavaScript file at the bottom -->
<script src="guess.json"></script>
</body>
</html>
